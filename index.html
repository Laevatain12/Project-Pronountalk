<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PronounTalk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PronounTalk</h1>
    <button id="logoutBtn" class="ghost hidden">Keluar</button>
  </header>

  <!-- 1. LOGIN -->
  <section id="authScreen" class="screen">
    <div class="card narrow">
      <h2 id="authTitle">Masuk</h2>

      <form id="loginForm">
        <label>Email <input type="email" name="email" required></label>
        <label>Kata sandi <input type="password" name="password" required minlength="6"></label>
        <button type="submit" class="primary full">Masuk</button>
      </form>

      <form id="registerForm" class="hidden">
        <label>Email <input type="email" name="email" required></label>
        <label>Kata sandi (minimal 6 karakter) <input type="password" name="password" required minlength="6"></label>
        <button type="submit" class="primary full">Daftar</button>
      </form>

      <p class="center"><button id="toggleAuth" class="link">Belum punya akun? Daftar</button></p>
      <p id="authMsg" class="msg"></p>
    </div>
  </section>

  <!-- 2. BIODATA (onboarding dan ubah biodata) -->
  <section id="bioScreen" class="screen hidden">
    <div class="card narrow">
      <h2>Isi biodata</h2>
      <p class="note">Data ini dipakai untuk papan skor dan pasangan belajar.</p>
      <form id="bioForm">
        <label>Nama lengkap <input name="nama" required></label>
        <label>Asal sekolah / kampus <input name="sekolah" required></label>
        <label>Umur <input name="umur" type="number" min="5" max="99" required></label>
        <button type="submit" class="primary full">Simpan &amp; lanjut</button>
      </form>
    </div>
  </section>

  <!-- 3. DASHBOARD -->
  <section id="dashScreen" class="screen hidden">
    <div class="dash">
      <aside>
        <button class="tab active" data-tab="biodata">Biodata</button>
        <button class="tab" data-tab="skor">Papan Skor</button>
        <button class="tab" data-tab="soal">Soal Basic English</button>
      </aside>
      <div class="content">
        <div id="tab-biodata" class="panel">
          <h2>Biodata</h2>
          <div id="bioView"></div>
          <button id="editBioBtn" class="secondary">Ubah biodata</button>
        </div>
        <div id="tab-skor" class="panel hidden">
          <h2>Papan Skor</h2>
          <div id="skorContent"></div>
        </div>
        <div id="tab-soal" class="panel hidden">
          <h2>Soal Basic English</h2>
          <div id="soalContent"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
